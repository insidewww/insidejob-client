name: Validate frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Refresh the published sitemap through Render's connected main branch.
    - cron: "0 0 1 * *"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_WP_API_URL: ${{ vars.VITE_WP_API_URL }}
      BASE_URL: ${{ vars.SITE_URL || secrets.BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Validate public configuration
        run: |
          node --input-type=module <<'NODE'
          import { readSiteConfig } from './scripts/config.mjs';
          readSiteConfig(process.env);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run sitemap
      - run: npm run build
      - name: Publish the monthly sitemap update
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh WordPress sitemap"
            git push
          fi
